name: Build and deploy Python project to Azure Function App using OIDC

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: 'nebula-telegram-bot'
  AZURE_RESOURCE_GROUP: 'telegram-bot-dev'
  PYTHON_VERSION: '3.10'

# Single job on purpose. The documented Python template splits build/deploy and
# hands the tree over via upload/download-artifact, but that round-trip strips the
# executable bit off ffmpeg/ffprobe (tracked as mode 100755, so a plain checkout
# already has it) and the template omits `include-hidden-files: true`, which would
# silently drop the hidden .python_packages directory holding every dependency.
# Building and deploying in one job avoids both problems.
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC
      contents: read # Required for actions/checkout
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v6

      - name: 'Set up Python version: ${{ env.PYTHON_VERSION }}'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 'Install uv'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: 'Regenerate requirements.txt from uv.lock'
        run: uv export --format requirements-txt --no-hashes --no-emit-project -o requirements.txt

      # This app is on a Y1 Linux Consumption plan, which deploys via *external
      # package URL* (WEBSITE_RUN_FROM_PACKAGE + SAS blob). That path has no Kudu
      # build step, so remote-build / scm-do-build-during-deployment /
      # enable-oryx-build cannot apply and are silently ignored -- deleting this
      # step ships source with no dependencies, the worker fails to import
      # function_app.py, and the app registers zero functions while the deploy
      # still reports success. The workflow is the only place the build can happen.
      - name: 'Install project dependencies'
        run: pip install -r requirements.txt --target ".python_packages/lib/site-packages"

      # TODO: run tests/lint here once they exist (docs/issues/16, docs/issues/17)

      - name: 'Log in to Azure via OIDC'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 'Deploy to Azure Functions'
        uses: Azure/functions-action@v1
        id: deploy-to-function-app
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: '.'
          respect-funcignore: true

      # A successful deploy is not the same as a working app: a Python worker that
      # fails to import registers no functions while the deploy still reports
      # success. That gap hid the breakage across three runs, so fail loudly here.
      - name: 'Verify functions are registered'
        run: |
          for i in $(seq 1 10); do
            count=$(az functionapp function list \
              -n "$AZURE_FUNCTIONAPP_NAME" -g "$AZURE_RESOURCE_GROUP" \
              --query "length(@)" -o tsv 2>/dev/null || echo 0)
            if [ "${count:-0}" -gt 0 ]; then
              echo "OK: $count function(s) registered"
              az functionapp function list \
                -n "$AZURE_FUNCTIONAPP_NAME" -g "$AZURE_RESOURCE_GROUP" \
                --query "[].name" -o tsv
              exit 0
            fi
            echo "attempt $i: no functions registered yet, waiting..."
            sleep 15
          done
          echo "FAILED: no functions registered - the worker probably could not import function_app.py"
          exit 1
