name: Build and deploy Python project to Azure Function App using OIDC

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: 'nebula-telegram-bot'
  PYTHON_VERSION: '3.10'

# Single job on purpose. Oryx installs dependencies server-side from source, so
# there is no prebuilt package to hand between jobs. The old build/deploy split
# also round-tripped the tree through upload/download-artifact, which stripped the
# executable bit off ffmpeg/ffprobe (tracked as mode 100755, so a plain checkout
# already has it) and needed a compensating chmod.
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v6

      - name: 'Set up Python version: ${{ env.PYTHON_VERSION }}'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 'Install uv'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      # Oryx runs `pip install -r requirements.txt` server-side, so this file is the
      # only dependency manifest that reaches Azure. Regenerating it from uv.lock
      # means the deployed package can never drift from the lockfile (docs/issues/15).
      - name: 'Regenerate requirements.txt from uv.lock'
        run: uv export --format requirements-txt --no-hashes --no-emit-project -o requirements.txt

      # TODO: run tests/lint here once they exist (docs/issues/16, docs/issues/17)

      - name: 'Log in to Azure via OIDC'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Deliberately NO `pip install --target .python_packages/lib/site-packages`
      # step: that builds wheels on a generic ubuntu-latest runner instead of the
      # Azure Functions Python image, which is what shipped a package the app could
      # not run. scm-do-build-during-deployment + enable-oryx-build hand the build to
      # Kudu/Oryx instead. Both are required together -- either one alone is a no-op.
      #
      # `remote-build` is NOT set: per the Azure Functions docs support matrix it
      # applies only to Flex Consumption, and this app is on a Y1 Consumption plan.
      - name: 'Deploy to Azure Functions (Oryx remote build)'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: '.'
          respect-funcignore: true
          scm-do-build-during-deployment: true
          enable-oryx-build: true
