name: Build and deploy Python project to Azure Function App using OIDC

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: 'nebula-telegram-bot'
  AZURE_RESOURCE_GROUP: 'telegram-bot-dev'
  PYTHON_VERSION: '3.10'
  # Pinned. The npm package (azure-functions-core-tools@4) cannot be used: its
  # post-install fetches a CDN zip for a CLI build newer than any published
  # release and gets a 404. The Microsoft apt feed has no
  # azure-functions-core-tools-4 package for noble or jammy either.
  FUNC_CLI_VERSION: '4.12.1'

# Single job on purpose. A remote build ships *source* and lets Oryx install the
# dependencies inside the real Azure Functions Python image, so there is no
# prebuilt package to hand between jobs. The old build/deploy split also
# round-tripped the tree through upload/download-artifact, which stripped the
# executable bit off ffmpeg/ffprobe (tracked as mode 100755, so a plain checkout
# already has it) and needed a compensating chmod.
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v6

      - name: 'Set up Python version: ${{ env.PYTHON_VERSION }}'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 'Install uv'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      # Oryx runs `pip install -r requirements.txt` server-side, so this file is the
      # only dependency manifest that reaches Azure. Regenerating it from uv.lock
      # means the deployed package can never drift from the lockfile (docs/issues/15).
      - name: 'Regenerate requirements.txt from uv.lock'
        run: uv export --format requirements-txt --no-hashes --no-emit-project -o requirements.txt

      # TODO: run tests/lint here once they exist (docs/issues/16, docs/issues/17)

      - name: 'Cache Azure Functions Core Tools'
        id: func-cache
        uses: actions/cache@v4
        with:
          path: ~/func-cli
          key: func-cli-linux-x64-${{ env.FUNC_CLI_VERSION }}

      - name: 'Install Azure Functions Core Tools'
        if: steps.func-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/func.zip \
            "https://github.com/Azure/azure-functions-core-tools/releases/download/${FUNC_CLI_VERSION}/Azure.Functions.Cli.linux-x64.${FUNC_CLI_VERSION}.zip"
          mkdir -p "$HOME/func-cli"
          unzip -q /tmp/func.zip -d "$HOME/func-cli"

      - name: 'Put func on PATH'
        run: |
          chmod +x "$HOME/func-cli/func"
          if [ -f "$HOME/func-cli/gozip" ]; then chmod +x "$HOME/func-cli/gozip"; fi
          echo "$HOME/func-cli" >> "$GITHUB_PATH"

      - name: 'Verify Core Tools'
        run: func --version

      - name: 'Log in to Azure via OIDC'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # local.settings.json is gitignored, so a CI checkout has no copy. Core Tools
      # reads FUNCTIONS_WORKER_RUNTIME from it to decide the project is Python;
      # without it the publish cannot determine a worker runtime. Values are
      # placeholders and never leave the runner: .funcignore excludes this file from
      # the package, and we deliberately do NOT pass --publish-local-settings / -i,
      # which would overwrite the app's real settings with these placeholders.
      - name: 'Synthesize local.settings.json for runtime detection'
        run: |
          cat > local.settings.json <<'EOF'
          {
            "IsEncrypted": false,
            "Values": {
              "AzureWebJobsStorage": "",
              "FUNCTIONS_WORKER_RUNTIME": "python"
            }
          }
          EOF

      # Mirrors ./deploy-function.ps1, which is the only mechanism proven to work on
      # this app. Azure/functions-action cannot remote-build here: on Linux
      # Consumption with RBAC it hard-routes to the WEBSITE_RUN_FROM_PACKAGE blob
      # path, which has no Kudu build step, so scm-do-build-during-deployment and
      # enable-oryx-build are silently ignored. Deploying source without a build that
      # way leaves the app with no dependencies and zero registered functions.
      #
      # --build remote is the default on Linux Consumption but is stated explicitly
      # so a Core Tools default change cannot silently turn this into a local build.
      - name: 'Publish to Azure Functions (remote build)'
        run: |
          func azure functionapp publish "$AZURE_FUNCTIONAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --build remote

      # A successful publish is not the same as a working app: a Python worker that
      # fails to import registers no functions while the deploy still reports success.
      - name: 'Verify functions are registered'
        run: |
          set -o pipefail
          for i in $(seq 1 10); do
            count=$(az functionapp function list \
              -n "$AZURE_FUNCTIONAPP_NAME" -g "$AZURE_RESOURCE_GROUP" \
              --query "length(@)" -o tsv 2>/dev/null || echo 0)
            if [ "${count:-0}" -gt 0 ]; then
              echo "OK: $count function(s) registered"
              az functionapp function list \
                -n "$AZURE_FUNCTIONAPP_NAME" -g "$AZURE_RESOURCE_GROUP" \
                --query "[].name" -o tsv
              exit 0
            fi
            echo "attempt $i: no functions registered yet, waiting..."
            sleep 15
          done
          echo "FAILED: no functions registered after deploy - the worker probably could not import function_app.py"
          exit 1
