name: Build and deploy Python project to Azure Function App using OIDC

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: 'nebula-telegram-bot'
  AZURE_RESOURCE_GROUP: 'telegram-bot-dev'
  FUNCTIONS_IMAGE: 'mcr.microsoft.com/azure-functions/python:4-python3.10'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      # Must run inside FUNCTIONS_IMAGE: pip on the runner resolves wheels against
      # glibc 2.39 that cannot load on the app (Debian 11, glibc 2.31).
      - name: Install dependencies in the Functions runtime image
        run: |
          docker run --rm -v "$PWD:/w" -w /w \
            --entrypoint /bin/bash "$FUNCTIONS_IMAGE" -c '
              set -e
              python -m pip install --upgrade pip
              pip install --no-cache-dir -r requirements.txt \
                --target .python_packages/lib/site-packages
            '
          sudo chown -R "$(id -u):$(id -g)" .python_packages

      - name: Smoke-test dependencies
        run: |
          cat > smoke_test.py <<'EOF'
          import asyncio
          assert "site-packages" not in asyncio.__file__, asyncio.__file__
          import aiohttp, azure.functions, cryptography, langchain_openai, openai, pydub
          print("imports OK")
          EOF
          docker run --rm -v "$PWD:/w" -w /w \
            -e PYTHONPATH=/w/.python_packages/lib/site-packages \
            --entrypoint /bin/bash "$FUNCTIONS_IMAGE" -c "python /w/smoke_test.py"
          rm smoke_test.py

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: '.'
          respect-funcignore: true

      # A green deploy does not mean a working app: a worker that fails to import
      # registers no functions while the deploy still reports success.
      - name: Verify functions are registered
        run: |
          for i in $(seq 1 10); do
            n=$(az functionapp function list -n "$AZURE_FUNCTIONAPP_NAME" \
              -g "$AZURE_RESOURCE_GROUP" --query "length(@)" -o tsv 2>/dev/null || echo 0)
            if [ "${n:-0}" -gt 0 ]; then
              echo "OK: $n function(s) registered"
              exit 0
            fi
            echo "attempt $i: none yet, waiting..."
            sleep 15
          done
          echo "FAILED: no functions registered"
          exit 1
