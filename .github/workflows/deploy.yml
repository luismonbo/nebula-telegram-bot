name: Build and deploy Python project to Azure Function App using OIDC

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: 'nebula-telegram-bot'
  PYTHON_VERSION: '3.10'
  BUILD_ARTIFACT_NAME: 'nebula-function-package'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v6

      - name: 'Set up Python version: ${{ env.PYTHON_VERSION }}'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 'Install uv'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: 'Regenerate requirements.txt from uv.lock'
        run: uv export --format requirements-txt --no-hashes -o requirements.txt

      # TODO: run tests/lint here once they exist (docs/issues/16, docs/issues/17)

      - name: 'Install dependencies into the deployment package'
        run: pip install -r requirements.txt --target ".python_packages/lib/site-packages"

      - name: 'Upload artifact for the deployment job'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BUILD_ARTIFACT_NAME }}
          include-hidden-files: true
          path: |
            .
            !.git

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
    steps:
      - name: 'Download artifact from build job'
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.BUILD_ARTIFACT_NAME }}
          path: downloaded-artifact

      - name: 'Restore executable bit on ffmpeg/ffprobe'
        run: chmod +x downloaded-artifact/ffmpeg downloaded-artifact/ffprobe

      - name: 'Log in to Azure via OIDC'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 'Deploy to Azure Functions'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: downloaded-artifact
          respect-funcignore: true
